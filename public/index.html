<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hair Day - Agendamento de Cortes de Cabelo</title>

    <meta
      name="description"
      content="Aplicação web para agendamento e consulta de cortes de cabelo por data e horário." />
    <meta name="author" content="Victor Martins Dias" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://victormartinsd.github.io/hairday/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;700&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hair Day - Agendamento de Cortes de Cabelo" />
    <meta
      property="og:description"
      content="Aplicação web para agendamento e consulta de cortes de cabelo por data e horário." />
    <meta property="og:image" content="https://victormartinsd.github.io/hairday/preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hair Day - Agendamento de Cortes de Cabelo" />
    <meta
      name="twitter:description"
      content="Aplicação web para agendamento e consulta de cortes de cabelo por data e horário." />
    <meta name="twitter:image" content="https://victormartinsd.github.io/hairday/preview.png" />

    <style>
      html {
        background-color: #19181b;
      }

      body {
        opacity: 0;
        visibility: hidden;
        background-color: #19181b;
        transition: opacity 120ms ease-in;
      }

      html.app-ready body {
        opacity: 1;
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img src="./assets/logo.svg" alt="Logo" class="logo" />

      <form class="form">
        <header>
          <h1>Agende um atendimento</h1>
          <p>Selecione data, horário e informe o nome do cliente para criar o agendamento</p>
        </header>

        <label for="date" class="label">Data</label>
        <div class="input">
          <i><img src="./assets/calendar.svg" alt="Calendário" /></i>
          <input type="date" id="date" name="date" required />
        </div>

        <span class="label">Horários</span>
        <ul id="hours" class="hours" aria-label="Horários disponíveis de manhã"></ul>

        <label for="client" class="label">Cliente</label>
        <div class="input">
          <i><img src="./assets/person.svg" alt="Calendário" /></i>
          <input type="text" id="client" name="client" placeholder="Nome do cliente" required />
        </div>

        <button type="submit" class="button">Agendar</button>
      </form>

      <aside class="schedule">
        <header>
          <h1>Agendamentos</h1>
          <p>Visualize os agendamentos de acordo com o dia selecionado</p>
        </header>

        <section class="schedule-period">
          <header>
            <img src="./assets/morning.svg" alt="Manhã" />
            <strong>Manhã</strong>
            <span>09h-12h</span>
          </header>
          <ul id="period-morning" class="period"></ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./assets/afternoon.svg" alt="Tarde" />
            <strong>Tarde</strong>
            <span>13h-18h</span>
          </header>
          <ul id="period-afternoon" class="period"></ul>
        </section>

        <section class="schedule-period">
          <header>
            <img src="./assets/night.svg" alt="noite" />
            <strong>noite</strong>
            <span>19h-21h</span>
          </header>
          <ul id="period-night" class="period"></ul>
        </section>
      </aside>
    </div>
  </body>
</html>
